plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
}

subprojects {
    group = 'com.example.navigation'
    version = '0.1.0'
}

// Keep Kotlin incremental caches outside OneDrive while preserving the conventional app/build APK path.
project(':core') {
    layout.buildDirectory = file(
        "${System.getProperty('java.io.tmpdir')}some-gradle-build/core"
    )
}
tasks.register('assembleDebug') { dependsOn ':app:assembleDebug' }
tasks.register('runNavigationBenchmark') { dependsOn ':core:runNavigationBenchmark' }
