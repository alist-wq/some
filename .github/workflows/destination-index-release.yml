name: Publish signed Kharkiv destination index

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Immutable destination-index package version
        required: true
        type: string
      acceptance_only:
        description: Sign a distinct test payload but do not publish a release or public download
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    environment: destination-index-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ephemeral PBF reader
        run: python3 -m pip install --disable-pip-version-check osmium==3.7.0
      - name: Fetch and verify locked source
        run: |
          set -euo pipefail
          source tools/brouter/locked-inputs/ua-kharkiv-pedestrian.env
          curl --fail --location --retry 3 "$PBF_URL" --output ukraine.osm.pbf
          printf '%s  %s\n' "$PBF_SHA256" ukraine.osm.pbf | sha256sum --check --strict
      - name: Build twice and compare
        run: |
          set -euo pipefail
          mkdir one two
          python3 tools/destination-index/build_destination_index.py --input ukraine.osm.pbf --output one/destination-index.jsonl
          python3 tools/destination-index/build_destination_index.py --input ukraine.osm.pbf --output two/destination-index.jsonl
          cmp one/destination-index.jsonl two/destination-index.jsonl
      - name: Make a deterministic non-production payload variant
        if: ${{ inputs.acceptance_only }}
        run: |
          set -euo pipefail
          case "${{ inputs.package_version }}" in acceptance-*) ;; *) echo 'Acceptance version must use acceptance- prefix' >&2; exit 1;; esac
          python3 tools/destination-index/build_acceptance_variant.py --input one/destination-index.jsonl --output one/acceptance-index.jsonl
          python3 tools/destination-index/build_acceptance_variant.py --input two/destination-index.jsonl --output two/acceptance-index.jsonl
          cmp one/acceptance-index.jsonl two/acceptance-index.jsonl
          test "$(sha256sum one/destination-index.jsonl | cut -d' ' -f1)" != "$(sha256sum one/acceptance-index.jsonl | cut -d' ' -f1)"
          mv one/acceptance-index.jsonl one/destination-index.jsonl
          mv two/acceptance-index.jsonl two/destination-index.jsonl
      - name: Create canonical manifest
        run: python3 tools/destination-index/write_manifest.py --index one/destination-index.jsonl --lock tools/brouter/locked-inputs/ua-kharkiv-pedestrian.env --package-version "${{ inputs.package_version }}" --output one/manifest.json
      - name: Sign and verify release evidence
        env:
          RENAV_DESTINATION_INDEX_ED25519_PRIVATE_KEY: ${{ secrets.RENAV_DESTINATION_INDEX_ED25519_PRIVATE_KEY }}
          EXPECTED_FINGERPRINT: SHA256:SXfNV9xLocPsovQ18P9E289B8Tg9M5T4uRHIn42G3Dg
        run: |
          set -euo pipefail
          test -n "$RENAV_DESTINATION_INDEX_ED25519_PRIVATE_KEY"
          key_file="$(mktemp)"; trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RENAV_DESTINATION_INDEX_ED25519_PRIVATE_KEY" > "$key_file"; chmod 600 "$key_file"
          ssh-keygen -Y sign -f "$key_file" -n renav-destination-index-manifest one/manifest.json
          ssh-keygen -y -f "$key_file" > one/renav-destination-index-ed25519.pub
          test "$(ssh-keygen -lf one/renav-destination-index-ed25519.pub -E sha256 | awk '{print $2}')" = "$EXPECTED_FINGERPRINT"
          printf 'renav-destination-index %s\n' "$(cat one/renav-destination-index-ed25519.pub)" > one/allowed-signers
          ssh-keygen -Y verify -f one/allowed-signers -I renav-destination-index -n renav-destination-index-manifest -s one/manifest.json.sig < one/manifest.json
      - name: Refuse an existing immutable version
        if: ${{ !inputs.acceptance_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="destination-index-ua-kharkiv-pedestrian-${{ inputs.package_version }}"
          ! gh release view "$tag" >/dev/null 2>&1
      - name: Publish immutable assets to R2
        if: ${{ !inputs.acceptance_only }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RENAV_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RENAV_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_S3_ENDPOINT: ${{ secrets.RENAV_R2_S3_ENDPOINT }}
          R2_BUCKET: renav-public-releases
          R2_PUBLIC_BASE_URL: https://downloads.renav.me
        run: |
          set -euo pipefail
          command -v aws >/dev/null
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_S3_ENDPOINT"
          prefix="renav/destination-index/ua-kharkiv-pedestrian/${{ inputs.package_version }}"
          for asset in destination-index.jsonl manifest.json manifest.json.sig renav-destination-index-ed25519.pub; do
            key="$prefix/$asset"
            ! aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_S3_ENDPOINT" >/dev/null 2>&1
            aws s3 cp "one/$asset" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_S3_ENDPOINT" --no-progress
            curl --fail --silent --show-error --location "$R2_PUBLIC_BASE_URL/$key" --output "published-$asset"
            cmp "one/$asset" "published-$asset"
          done
      - name: Publish immutable assets
        if: ${{ !inputs.acceptance_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="destination-index-ua-kharkiv-pedestrian-${{ inputs.package_version }}"
          gh release create "$tag" one/destination-index.jsonl one/manifest.json one/manifest.json.sig one/renav-destination-index-ed25519.pub --title "RENAV Kharkiv destination index ${{ inputs.package_version }}" --notes "Signed offline destination index. © OpenStreetMap contributors, ODbL 1.0."
      - name: Keep acceptance package private to this workflow run
        if: ${{ inputs.acceptance_only }}
        uses: actions/upload-artifact@v4
        with:
          name: destination-index-${{ inputs.package_version }}
          path: |
            one/destination-index.jsonl
            one/manifest.json
            one/manifest.json.sig
            one/renav-destination-index-ed25519.pub
          retention-days: 7
          if-no-files-found: error

