name: Deploy RENAV prototype to GitHub Pages

on:
  push:
    branches:
      - codex/renav-ui-ux-prototype
    paths:
      - 'docs/ux/renav-redesign/**'
      - '.github/workflows/deploy-renav-prototype-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: renav-prototype-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/ux/renav-redesign
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
