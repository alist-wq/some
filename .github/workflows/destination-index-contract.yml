name: Destination-index distribution contract

on:
  pull_request:
    paths:
      - '.github/workflows/destination-index-release.yml'
      - '.github/workflows/destination-index-contract.yml'
      - 'tools/destination-index/**'
      - 'docs/architecture/acceptance-artifact-security.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify destination-index build and distribution policy
        run: python3 -m unittest discover -s tools/destination-index/tests -p 'test_*.py' -v
      - name: Verify encrypted acceptance transfer with an ephemeral fixture key
        run: |
          set -euo pipefail
          export RENAV_ACCEPTANCE_ARTIFACT_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          mkdir -p fixture recovered
          for asset in destination-index.jsonl manifest.json manifest.json.sig renav-destination-index-ed25519.pub; do
            printf 'fixture-secret-%s\n' "$asset" > "fixture/$asset"
          done
          bash tools/destination-index/encrypt_acceptance_package.sh fixture acceptance-package.tar.enc
          ! grep -a -q 'fixture-secret' acceptance-package.tar.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in acceptance-package.tar.enc -out recovered.tar -pass env:RENAV_ACCEPTANCE_ARTIFACT_KEY
          tar -xf recovered.tar -C recovered
          for asset in destination-index.jsonl manifest.json manifest.json.sig renav-destination-index-ed25519.pub; do
            cmp "fixture/$asset" "recovered/$asset"
          done

